<!doctype html>
<html><head><meta charset="utf-8"><title>Camera test</title></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:20px">
<h2>Camera test</h2>
<button id="b">Start camera</button>
<p id="s">idle</p>
<video id="v" autoplay playsinline muted style="width:480px;border:2px solid #3ddc97;display:block"></video>
<canvas id="c" width="640" height="480" style="width:480px;display:block;margin-top:10px"></canvas>
<script>
let n = 0;
document.getElementById("b").onclick = async () => {
  const s = document.getElementById("s"), v = document.getElementById("v");
  const c = document.getElementById("c"), x = c.getContext("2d");
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    v.srcObject = st;
    await v.play();
    s.textContent = "camera on: " + v.videoWidth + "x" + v.videoHeight;
    const draw = () => {
      x.drawImage(v, 0, 0, c.width, c.height);
      s.textContent = "frames drawn: " + (++n);
      requestAnimationFrame(draw);
    };
    draw();
  } catch (e) {
    s.textContent = "error: " + e.name + " - " + e.message;
  }
};
</script></body></html>
